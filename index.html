<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zackary Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 5px;
      color: #ccc;
    }

    .search {
      padding: 15px;
      background: white;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px;
      background: white;
    }

    .categories button {
      border: none;
      background: #eee;
      padding: 10px 15px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 15px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .product-info {
      padding: 12px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .order-btn {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 11px;
      border-radius: 8px;
    }

    footer {
      margin-top: 30px;
      padding: 25px 15px;
      background: #111;
      color: white;
      text-align: center;
      line-height: 1.8;
    }

    footer strong {
      display: block;
      margin-top: 5px;
    }

    .bottom-menu {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: space-around;
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px 5px;
    }

    .bottom-menu button {
      border: none;
      background: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>ZACKARY SHOP</h1>
    <p>Mode • Streetwear • Lifestyle</p>
  </header>

  <div class="search">
    <input
      type="text"
      placeholder="🔎 Rechercher un article..."
    >
  </div>

  <div class="categories">
    <button>Tous</button>
    <button>Hommes</button>
    <button>Femmes</button>
    <button>Chaussures</button>
    <button>Accessoires</button>
  </div>

  <main class="products">

    <div class="product">

      <img
        src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
        alt="T-shirt"
      >

      <div class="product-info">

        <h3>T-shirt Premium</h3>

        <p class="price">
          8 000 FCFA
        </p>

        <button class="order-btn">
          Commander
        </button>

      </div>

    </div>


    <div class="product">

      <img
        src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3"
        alt="Ensemble"
      >

      <div class="product-info">

        <h3>Ensemble Streetwear</h3>

        <p class="price">
          20 000 FCFA
        </p>

        <button class="order-btn">
          Commander
        </button>

      </div>

    </div>

  </main>


  <div class="bottom-menu">

    <button>🏠<br>Accueil</button>

    <button>🛍️<br>Boutique</button>

    <button>➕<br>Vendre</button>

    <button>👤<br>Compte</button>

  </div>


  <footer>

    <p>© 2026 Zackary Shop</p>

    <p>
      Livraison : 1 000 FCFA
    </p>

    <p>
      Byemassi et environs
    </p>

    <p>
      Retrait : Lycée de Byemassi
    </p>

    <strong>
      Ce site est fait par 𝖓𝖔𝖛𝖎𝖘_𝖋𝖇♛
    </strong>

    <p>
      WhatsApp : +237 690 847 035
    </p>

  </footer>

</body>
</html>
