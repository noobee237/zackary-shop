function escapeHtml(v){
if(v===null||v===undefined)return"";
return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
.replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function formatPrice(v){
return Number(v||0).toLocaleString("fr-FR")+" XAF";
}

function getAvatarUrl(p){
if(p?.avatar_url)return p.avatar_url;
return"https://ui-avatars.com/api/?name="+encodeURIComponent(p?.username||"User")+"&background=eeeeee&color=111111";
}

function getProductImages(p){

if(Array.isArray(p.images))p.images.forEach(x=>{if(x&&!a.includes(x))a.push(x)});

if(grid)grid.innerHTML='<div class="empty">Impossible de charger les articles.</div>';
console.error(error);return;
}

currentProducts=data||[];
await disableExpiredSellers();
renderProducts();
}

async function contactSellerWhatsApp(){
if(!selectedProduct)return alert("Article introuvable.");

const seller=await getSellerProfile(selectedProduct.seller_id);
if(!seller)return alert("Vendeur introuvable.");

const choice=document.querySelector('input[name="deliveryChoice"]:checked')?.value||"delivery";
const whatsapp=seller.whatsapp||seller.phone;
if(!whatsapp)return alert("Le vendeur n'a pas renseigné son numéro WhatsApp.");
if(choice==="pickup"&&!seller.pickup_location)return alert("Le vendeur doit renseigner son lieu de retrait.");

let phone=String(whatsapp).replace(/\D/g,"");
if(phone.length===9&&phone.startsWith("6"))phone="237"+phone;
if(phone.startsWith("00237"))phone=phone.substring(2);

let msg=`Bonjour ${seller.username||"vendeur"} 👋

Je suis intéressé(e) par votre article sur Zackary sh🛍️p.

🛍️ Article : ${selectedProduct.name}
💰 Prix : ${formatPrice(selectedProduct.price)}
`;

if(choice==="delivery"){
msg+=`\n🚚 Mode de réception : Livraison\n\nJe souhaite connaître les conditions et les frais de livraison.\n\nMerci.`;
}else{
msg+=`\n📍 Mode de réception : Retrait chez le vendeur\n\n📍 Lieu : ${seller.pickup_location}\n\nJe souhaite confirmer la disponibilité et les modalités de retrait.\n\nMerci.`;

}

await supabaseClient.from("profiles").upsert({

}

async function uploadAvatar(file){

const path=`${currentUser.id}/avatar.jpg`;

const {error}=await supabaseClient.storage.from("avatars").upload(path,file,{

});

const {data}=supabaseClient.storage.from("avatars").getPublicUrl(path);

if(profileError)return alert(profileError.message);

}

async function publishProduct(){
if(!currentUser)return;

if(currentProfile?.role==="seller"&&currentProfile.seller_expires_at&&new Date(currentProfile.seller_expires_at)<=new Date()){
alert("Ton accès vendeur a expiré.");await checkSellerExpiration();return;
}

const name=document.getElementById("productName")?.value.trim();
const price=Number(document.getElementById("productPrice")?.value);
const category=document.getElementById("productCategory")?.value;
const description=document.getElementById("productDescription")?.value.trim();
const files=Array.from(document.getElementById("productImages")?.files||[]);

if(!name||!price||!category)return alert("Remplis les informations principales.");
if(files.length>4)return alert("Maximum 4 photos.");

const images=[];

for(let i=0;i<files.length;i++){
const file=files[i];
const ext=file.name.split(".").pop().toLowerCase();
const path=`${currentUser.id}/${Date.now()}-${i}.${ext}`;

const {error}=await supabaseClient.storage.from("product-images").upload(path,file,{
upsert:false,contentType:file.type
});
if(error)return alert(error.message);

const {data}=supabaseClient.storage.from("product-images").getPublicUrl(path);
images.push(data.publicUrl);
}

const product={
seller_id:currentUser.id,
seller_name:currentProfile?.username||"Vendeur",
name,price,category,description
};

if(images[0])product.image_url=images[0];
if(images[1])product.image_url_2=images[1];
if(images[2])product.image_url_3=images[2];
if(images[3])product.image_url_4=images[3];

const {error}=await supabaseClient.from("products").insert(product);
if(error)return alert(error.message);

alert("Article publié avec succès.");
await loadProducts();await renderSellerPage();
}

if(!c)return;

const {data,error}=await supabaseClient.from("profiles").select("*").eq("role","seller").order("created_at",{ascending:false});

if(error)return c.innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`;
if(!data?.length)return c.innerHTML='<div class="empty">Aucun vendeur.</div>';

c.innerHTML=data.map(s=>{
const active=s.seller_expires_at&&new Date(s.seller_expires_at)>new Date();
return`
<div class="admin-seller">
<div style="display:flex;align-items:center;gap:10px">
<img class="seller-avatar" src="${escapeHtml(getAvatarUrl(s))}">
<div>
<strong>${escapeHtml(s.username||"Vendeur")}</strong>
<div style="font-size:12px;color:#777">${active?"Actif":"Inactif"}</div>
</div>
</div>
<div class="admin-actions">
<button class="secondary-button" onclick="activateSeller('${escapeHtml(s.id)}')">+30 jours</button>
<button class="danger-button" onclick="disableSeller('${escapeHtml(s.id)}')">Désactiver</button>
</div>
</div>`;
}).join("");
}

async function activateSeller(id){
const {error}=await supabaseClient.rpc("creator_activate_seller",{seller_id:id});
if(error)return alert(error.message);
alert("Vendeur activé pour 30 jours.");renderAdminPanel();
}

async function disableSeller(id){
const {error}=await supabaseClient.rpc("creator_disable_seller",{seller_id:id});
if(error)return alert(error.message);
alert("Vendeur désactivé.");renderAdminPanel();
}

async function renderGlobalSales(){
const c=document.getElementById("globalSales");
if(!c)return;

const {data,error}=await supabaseClient.from("sales").select("*").order("created_at",{ascending:false});
if(error)return c.innerHTML='<div class="empty">Impossible de charger les ventes.</div>';
if(!data?.length)return c.innerHTML='<div class="empty">Aucune vente enregistrée.</div>';

let total=0;
data.forEach(s=>total+=Number(s.amount||s.price||0));

c.innerHTML=`
<div class="sales-card glass-card">
<strong>Chiffre d'affaires total</strong>
<div style="font-size:22px;font-weight:800;margin-top:5px">${formatPrice(total)}</div>
</div>
${data.map(s=>`
<div class="sales-card glass-card">
<strong>${escapeHtml(s.product_name||"Vente")}</strong>
<div style="color:#777;font-size:12px">${formatPrice(s.amount||s.price||0)}</div>
</div>`).join("")}`;
}

/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange((event,session)=>{
currentUser=session?.user||null;
setTimeout(()=>checkUser(),0);
});

/* =========================
   INIT
========================= */

async function initialize(){
renderCategories();
updateCartBadge();
await checkUser();
await loadProducts();
renderCart();
}

setInterval(async()=>{
if(currentUser)await checkSellerExpiration();
},60000);

initialize();
</script>
