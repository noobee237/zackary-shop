<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#171717;
  padding-bottom:80px;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:12px 15px;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.account-btn{
  border:0;
  background:#111;
  color:#fff;
  border-radius:25px;
  padding:9px 14px;
  font-weight:700;
}

.search-box{
  margin-top:10px;
}

.search-box input{
  width:100%;
  padding:12px 15px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
}

/* PAGES */

.page{
  display:none;
  padding:18px 15px;
}

.page.active{
  display:block;
}

.section-title{
  font-size:22px;
  margin-bottom:15px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
  margin-bottom:15px;
}

.category-btn{
  white-space:nowrap;
  border:1px solid #ddd;
  background:#fff;
  padding:9px 14px;
  border-radius:20px;
}

.category-btn.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

/* PRODUCTS */

.products-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.product-card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.product-card-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:10px;
}

.product-name{
  font-weight:700;
  font-size:15px;
  margin-bottom:6px;
}

.product-price{
  font-weight:800;
  margin-bottom:5px;
}

.product-category{
  color:#777;
  font-size:12px;
}

/* BUTTONS */

.primary-btn{
  width:100%;
  border:0;
  background:#111;
  color:#fff;
  padding:12px;
  border-radius:10px;
  font-weight:700;
  margin-top:10px;
}

.secondary-btn{
  width:100%;
  border:1px solid #ddd;
  background:#fff;
  color:#111;
  padding:12px;
  border-radius:10px;
  font-weight:700;
  margin-top:10px;
}

.danger-btn{
  width:100%;
  border:0;
  background:#d92d20;
  color:#fff;
  padding:11px;
  border-radius:10px;
  font-weight:700;
  margin-top:8px;
}

/* PRODUCT DETAIL */

.back-btn{
  border:0;
  background:#fff;
  padding:8px 0;
  font-weight:700;
  margin-bottom:12px;
}

.main-product-image{
  width:100%;
  max-height:420px;
  object-fit:contain;
  background:#eee;
  border-radius:14px;
}

.thumbnails{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:10px;
}

.thumbnail{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  border:2px solid transparent;
  cursor:pointer;
}

.thumbnail.active{
  border-color:#111;
}

.product-detail-info{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-top:15px;
}

.detail-price{
  font-size:24px;
  font-weight:900;
  margin:8px 0;
}

.detail-description{
  margin-top:15px;
  line-height:1.5;
  white-space:pre-wrap;
}

.seller-box{
  margin-top:18px;
  border-top:1px solid #eee;
  padding-top:15px;
}

.seller-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.avatar.large{
  width:90px;
  height:90px;
}

.creator-badge,
.verified-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#1877f2;
  color:#fff;
  border-radius:50%;
  width:18px;
  height:18px;
  font-size:11px;
  font-weight:900;
}

/* FORMS */

.form-card{
  background:#fff;
  padding:16px;
  border-radius:14px;
  margin-bottom:15px;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  font-weight:700;
  margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:10px;
  padding:11px;
  outline:none;
  background:#fff;
}

.form-group textarea{
  min-height:110px;
  resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#111;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
}

/* ACCOUNT */

.account-profile{
  background:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
  margin-bottom:15px;
}

.profile-avatar-container{
  position:relative;
  display:inline-block;
}

.avatar-upload-label{
  position:absolute;
  right:-3px;
  bottom:-3px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:14px;
}

.account-name{
  font-size:20px;
  font-weight:800;
  margin-top:10px;
}

.account-email{
  color:#777;
  margin-top:4px;
}

.role-badge{
  display:inline-block;
  margin-top:8px;
  padding:5px 10px;
  background:#eee;
  border-radius:15px;
  font-size:12px;
  font-weight:700;
}

.status-active{
  color:#16803c;
  font-weight:700;
}

.status-inactive{
  color:#c5221f;
  font-weight:700;
}

/* SELLER ARTICLES */

.article-row{
  background:#fff;
  padding:10px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  gap:10px;
}

.article-row img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:9px;
}

.article-row-info{
  flex:1;
}

/* SALES */

.sale-row{
  background:#fff;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
}

.sale-row strong{
  display:block;
  margin-bottom:5px;
}

.sales-total{
  background:#111;
  color:#fff;
  border-radius:13px;
  padding:18px;
  margin-bottom:15px;
}

.sales-total-number{
  font-size:25px;
  font-weight:900;
  margin-top:5px;
}

/* ADMIN */

.admin-card{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
}

.admin-card-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.admin-actions{
  margin-top:10px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal img{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
}

.modal-close{
  position:absolute;
  top:20px;
  right:20px;
  width:42px;
  height:42px;
  border-radius:50%;
  border:0;
  background:#fff;
  font-size:22px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#fff;
  border-top:1px solid #ddd;
  z-index:200;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-btn{
  border:0;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11px;
  color:#555;
}

.nav-btn.active{
  color:#111;
  font-weight:800;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:40px 15px;
  color:#777;
}

/* LOADING */

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

/* DESKTOP */

@media(min-width:700px){

  .products-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  main,
  section.page{
    max-width:1100px;
    margin:auto;
  }

  .bottom-nav{
    left:50%;
    transform:translateX(-50%);
    max-width:600px;
    border:1px solid #ddd;
    border-bottom:0;
    border-radius:15px 15px 0 0;
  }
}
</style>

<body>

<header>

  <div class="header-top">

    <button

</header>

<main id="homePage" class="page active">

    Produits

  <div
    id="categories"

    id="productsGrid"

  >
    <div class="loading">
      Chargement...
    </div>

</main>

<section
  id="productPage"

    id="navAccount"

  >
    👤
    <span>Compte</span>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://leoyfcpkjbvdhalyefcv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ZVx9Vqel2vvEylmrQGRT-A_SeAk8K3-";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let currentProfile = null;

let currentProducts = [];

let selectedCategory = "Tous";

let selectedProduct = null;


/* =========================================================
   CATEGORIES
========================================================= */

const categories = [
  "Tous",
  "T-shirts",
  "Ensembles/Jogging",
  "Pantalons",
  "Vestes",
  "Chaussures",
  "Accessoires"
];


function renderCategories(){

  const container =
    document.getElementById("categories");

  if(!container) return;

  container.innerHTML =
    categories.map(category => `

      <button
        class="category-btn ${
          selectedCategory === category
            ? "active"
            : ""
        }"
        onclick="selectCategory('${escapeHtml(category)}')"
      >
        ${escapeHtml(category)}
      </button>

    `).join("");
}


function selectCategory(category){

  selectedCategory = category;

  renderCategories();
  renderProducts();
}


/* =========================================================
   UTILS
========================================================= */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatPrice(price){

  return Number(price || 0)
    .toLocaleString("fr-FR") + " XAF";
}


function getAvatarUrl(profile){

  if(!profile?.avatar_url){
    return "https://ui-avatars.com/api/?name=Utilisateur&background=eeeeee&color=111111";
  }

  return profile.avatar_url;
}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page => {
      page.classList.remove("active");
    });

  const page =
    document.getElementById(pageId);

  if(page){
    page.classList.add("active");
  }

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  if(pageId === "homePage"){
    document
      .getElementById("navHome")
      ?.classList.add("active");
  }

  if(pageId === "sellPage"){
    document
      .getElementById("navSell")
      ?.classList.add("active");
  }

  if(pageId === "accountPage"){
    document
      .getElementById("navAccount")
      ?.classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


async function showSellPage(){

  showPage("sellPage");

  await renderSellPage();

}


/* =========================================================
   AUTH
========================================================= */

async function checkUser(){

  try{

    const {
      data:{
        session
      }
    } =
      await supabaseClient.auth.getSession();

    currentUser =
      session?.user || null;

    if(!currentUser){

      currentProfile = null;

      renderLoggedOutAccount();

      return;
    }

    /*
      IMPORTANT :
      On recharge TOUJOURS le profil depuis Supabase.
      Cela permet de récupérer la photo enregistrée
      même après une nouvelle connexion.
    */

    const {
      data:profile,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();

    if(error){

      console.error(
        "Erreur récupération profil:",
        error
      );

    }

    currentProfile =
      profile || null;

    renderLoggedInAccount();

    await renderProducts();

  }catch(error){

    console.error(
      "checkUser:",
      error
    );

  }

}


/* =========================================================
   LOGIN / REGISTER
========================================================= */

function renderLoggedOutAccount(){

  const container =
    document.getElementById(
      "accountContainer"
    );

  if(!container) return;

  container.innerHTML = `

    <div class="form-card">

      <h2>
        Connexion
      </h2>

      <div class="form-group">
        <label>Email</label>

        <input
          id="loginEmail"
          type="email"
          placeholder="ton@email.com"
        >
      </div>

      <div class="form-group">
        <label>Mot de passe</label>

        <input
          id="loginPassword"
          type="password"
          placeholder="Mot de passe"
        >
      </div>

      <button
        class="primary-btn"
        onclick="login()"
      >
        Se connecter
      </button>

    </div>


    <div class="form-card">

      <h2>
        Créer un compte
      </h2>

      <div class="form-group">
        <label>Nom / pseudo</label>

        <input
          id="registerUsername"
          type="text"
          placeholder="Ton pseudo"
        >
      </div>

      <div class="form-group">
        <label>Email</label>

        <input
          id="registerEmail"
          type="email"
          placeholder="ton@email.com"
        >
      </div>

      <div class="form-group">
        <label>Téléphone</label>

        <input
          id="registerPhone"
          type="tel"
          placeholder="237..."
        >
      </div>

      <div class="form-group">
        <label>Mot de passe</label>

        <input
          id="registerPassword"
          type="password"
          placeholder="Minimum 6 caractères"
        >
      </div>

      <button
        class="primary-btn"
        onclick="register()"
      >
        Créer mon compte
      </button>

    </div>

  `;
}


async function register(){

  const username =
    document
      .getElementById("registerUsername")
      ?.value
      .trim();

  const email =
    document
      .getElementById("registerEmail")
      ?.value
      .trim();

  const phone =
    document
      .getElementById("registerPhone")
      ?.value
      .trim();

  const password =
    document
      .getElementById("registerPassword")
      ?.value;

  if(
    !username ||
    !email ||
    !password
  ){

    alert(
      "Remplis tous les champs obligatoires."
    );

    return;
  }

  if(password.length < 6){

    alert(
      "Le mot de passe doit contenir au moins 6 caractères."
    );

    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email,
        password,

        options:{
          data:{
            username,
            phone
          }
        }

      });

    if(error){
      throw error;
    }

    if(data.user){

      /*
        Création du profil.
      */

      const {
        error:profileError
      } =
        await supabaseClient
          .from("profiles")
          .upsert({

            id:data.user.id,

            username,

            email,

            phone,

            role:"client",

            verified:false,

            avatar_url:null,

            seller_active:false,

            seller_payment_status:null

          });

      if(profileError){

        console.error(
          profileError
        );

      }
    }

    alert(
      "✅ Compte créé. Vérifie ton email si Supabase demande une confirmation."
    );

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Erreur lors de la création du compte."
    );

  }

}


async function login(){

  const email =
    document
      .getElementById("loginEmail")
      ?.value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      ?.value;

  if(!email || !password){

    alert(
      "Entre ton email et ton mot de passe."
    );

    return;
  }

  try{

    const {
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email,
        password

      });

    if(error){
      throw error;
    }

    /*
      checkUser récupère automatiquement
      avatar_url depuis profiles.
    */

    await checkUser();

    alert(
      "✅ Connexion réussie."
    );

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Email ou mot de passe incorrect."
    );

  }

}


async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentProfile = null;

  renderLoggedOutAccount();

  await renderProducts();

  showPage("homePage");

}


/* =========================================================
   ACCOUNT / PROFILE
========================================================= */

function renderLoggedInAccount(){

  const container =
    document.getElementById(
      "accountContainer"
    );

  if(!container) return;

  const profile =
    currentProfile || {};

  const avatar =
    getAvatarUrl(profile);

  let roleText = "Client";

  if(profile.role === "seller"){
    roleText = "Vendeur";
  }

  if(profile.role === "creator_admin"){
    roleText = "Administrateur";
  }

  let sellerStatus = "";

  if(profile.role === "seller"){

    const active =
      isSellerActive(profile);

    sellerStatus = active
      ? `<p class="status-active">● Vendeur actif</p>`
      : `<p class="status-inactive">● Vendeur inactif</p>`;

  }

  container.innerHTML = `

    <div class="account-profile">

      <div class="profile-avatar-container">

        <img
          id="profileAvatar"
          class="avatar large"
          src="${escapeHtml(avatar)}"
          alt="Photo de profil"
          onerror="this.src='https://ui-avatars.com/api/?name=Utilisateur&background=eeeeee&color=111111'"
        >

        <label
          class="avatar-upload-label"
          for="avatarInput"
          title="Changer la photo"
        >
          📷
        </label>

      </div>

      <input
        id="avatarInput"
        type="file"
        accept="image/*"
        class="hidden"
        onchange="uploadAvatar()"
      >

      <div class="account-name">

        ${escapeHtml(
          profile.username ||
          "Utilisateur"
        )}

        ${
          profile.role === "creator_admin"
            ? `<span class="creator-badge">✓</span>`
            : ""
        }

      </div>

      <div class="account-email">

        ${escapeHtml(
          profile.email ||
          currentUser?.email ||
          ""
        )}

      </div>

      <div class="role-badge">
        ${roleText}
      </div>

      ${sellerStatus}

      <button
        class="secondary-btn"
        onclick="document.getElementById('avatarInput').click()"

/* =========================================================

========================================================= */

async function uploadAvatar(){

  if(!currentUser){

    alert(
      "Tu dois être connecté."
    );

    return;
  }

  const input =
    document.getElementById(
      "avatarInput"
    );

  if(
    !input ||
    !input.files ||
    !input.files.length
  ){

    alert(
      "Choisis d'abord une photo."
    );

    return;
  }

  const file =
    input.files[0];

  if(!file.type.startsWith("image/")){

    alert(
      "Le fichier doit être une image."
    );

    input.value = "";

    return;
  }

  if(file.size > 5 * 1024 * 1024){

    alert(
      "La photo doit faire moins de 5 Mo."
    );

    input.value = "";

    return;
  }

  try{

    /*
      On utilise toujours le même fichier
      pour cet utilisateur.

      Exemple :

      avatars/
        ID_UTILISATEUR/
          avatar.jpg
    */

    const path =
      `${currentUser.id}/avatar.jpg`;


    /*
      Upload avec remplacement.
    */

    const {
      error:uploadError
    } =
      await supabaseClient.storage
        .from("avatars")
        .upload(

          path,

          file,

          {
            cacheControl:"3600",
            upsert:true,
            contentType:file.type
          }

        );


    if(uploadError){

      console.error(
        "UPLOAD AVATAR ERROR:",
        uploadError
      );

      throw new Error(
        "Erreur lors de l'envoi de la photo : " +
        uploadError.message
      );

    }


    /*
      URL publique.
    */

    const {
      data:publicData
    } =
      supabaseClient.storage
        .from("avatars")
        .getPublicUrl(path);


    if(
      !publicData ||
      !publicData.publicUrl
    ){

      throw new Error(
        "Impossible de récupérer l'URL de la photo."
      );

    }


    /*
      Anti-cache.
      Le ?v= permet de forcer le navigateur
      à afficher la nouvelle photo.
    */

    const avatarUrl =
      publicData.publicUrl +
      "?v=" +
      Date.now();


    /*
      Sauvegarde dans profiles.
    */

    const {
      error:profileError
    } =
      await supabaseClient
        .from("profiles")
        .update({

          avatar_url:avatarUrl

        })
        .eq(
          "id",
          currentUser.id
        );


    if(profileError){

      console.error(
        "PROFILE AVATAR ERROR:",
        profileError
      );

      throw new Error(
        "La photo a été envoyée mais la sauvegarde du profil a échoué : " +
        profileError.message
      );

    }


    /*
      Mise à jour locale.
    */

    if(!currentProfile){
      currentProfile = {};
    }

    currentProfile.avatar_url =
      avatarUrl;


    /*
      Mise à jour immédiate de l'image.
    */

    const profileAvatar =
      document.getElementById(
        "profileAvatar"
      );

    if(profileAvatar){

      profileAvatar.src =
        avatarUrl;

    }


    /*
      Recharge le profil depuis Supabase
      pour confirmer la sauvegarde.
    */

    await refreshProfile(false);


    input.value = "";


    alert(
      "✅ Photo de profil enregistrée avec succès."
    );


  }catch(error){

    console.error(
      "uploadAvatar:",
      error
    );

    alert(
      error.message ||
      "Impossible d'enregistrer la photo."
    );

    input.value = "";

  }

}

function isSellerActive(profile){

  if(!profile){
    return false;
  }

  if(profile.role === "creator_admin"){
    return true;
  }

  if(profile.role !== "seller"){
    return false;
  }

  if(profile.seller_active !== true){
    return false;
  }

  if(!profile.seller_expires_at){
    return false;
  }

  return new Date(
    profile.seller_expires_at
  ) > new Date();

}

async function renderProducts(){

  const grid =
    document.getElementById(
      "productsGrid"
    );

  if(!grid) return;

  grid.innerHTML = `
    <div class="loading">
      Chargement des produits...
    </div>
  `;

  try{

    await disableExpiredSellers();

    const products =
      await loadProducts();

    /*
      Récupération des profils des vendeurs.
    */

    const sellerIds =
      [
        ...new Set(
          products
            .map(product => product.user_id)
            .filter(Boolean)
        )
      ];

    let profiles = [];

    if(sellerIds.length){

      const {
        data
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,username,role,verified,avatar_url,phone,seller_active,seller_expires_at"
          )
          .in(
            "id",
            sellerIds
          );

      profiles =
        data || [];

    }


    const profileMap =
      new Map(
        profiles.map(
          profile => [
            profile.id,
            profile
          ]
        )
      );


    /*
      Seulement les vendeurs actifs.
    */

    const visibleProducts =
      products.filter(product => {

        const seller =
          profileMap.get(
            product.user_id
          );

        if(!seller){
          return false;
        }

        return isSellerActive(
          seller
        );

      });


    currentProducts =
      visibleProducts;


    const search =
      document
        .getElementById("searchInput")
        ?.value
        ?.toLowerCase()
        .trim() || "";


    let filtered =
      visibleProducts.filter(product => {

        const matchesCategory =
          selectedCategory === "Tous" ||
          product.category ===
            selectedCategory;

        const matchesSearch =
          !search ||
          String(product.name || "")
            .toLowerCase()
            .includes(search) ||
          String(product.description || "")
            .toLowerCase()
            .includes(search);

        return (
          matchesCategory &&
          matchesSearch
        );

      });


    if(!filtered.length){

      grid.innerHTML = `
        <div
          class="empty"
          style="grid-column:1/-1"
        >
          Aucun produit trouvé.
        </div>
      `;

      return;

    }


    grid.innerHTML =
      filtered.map(product => {

        const images =
          Array.isArray(
            product.image_urls
          )
            ? product.image_urls
            : [];

        const image =
          images[0] ||
          "https://via.placeholder.com/600x600?text=Produit";

        return `

          <article
            class="product-card"
            onclick="openProduct('${product.id}')"
          >

            <img
              class="product-card-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(product.name)}"
              loading="lazy"
            >

            <div class="product-info">

              <div class="product-name">
                ${escapeHtml(product.name)}
              </div>

              <div class="product-price">
                ${formatPrice(product.price)}
              </div>

              <div class="product-category">
                ${escapeHtml(product.category || "")}
              </div>

            </div>

          </article>

        `;

      }).join("");


  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1"
      >
        Impossible de charger les produits.
      </div>
    `;

  }

}

  );

function contactSeller(
  phone,
  productName
){

  let clean =
    String(phone)
      .replace(/\D/g,"");

  if(clean.startsWith("0")){
    clean =
      "237" +
      clean.substring(1);
  }

  const message =
    `Bonjour, je suis intéressé(e) par votre article "${productName}" sur Zackary sh🛍️p.`;

  const url =
    "https://wa.me/" +
    clean +
    "?text=" +
    encodeURIComponent(message);

  window.open(
    url,
    "_blank"
  );

}

        await supabaseClient.storage
          .from("product-images")
          .upload(
            path,
            file,
            {
              upsert:false,
              cacheControl:"3600",
              contentType:file.type
            }
          );


      if(error){
        throw error;
      }


      const {
        data
      } =
        supabaseClient.storage
          .from("product-images")
          .getPublicUrl(path);


      if(data?.publicUrl){

        imageUrls.push(
          data.publicUrl
        );

      }

    }


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .insert({

          user_id:
            currentUser.id,

          name,

          price,

          category,

          sizes,

          description,

          delivery,

          image_urls:imageUrls

        });


    if(error){
      throw error;
    }


    alert(
      "✅ Article publié."
    );


    document
      .getElementById("productName")
      .value = "";

    document
      .getElementById("productPrice")
      .value = "";

    document
      .getElementById("productSizes")
      .value = "";

    document
      .getElementById("productDescription")
      .value = "";

    document
      .getElementById("productImages")
      .value = "";


    await renderSellerProducts();

    await renderProducts();


  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Erreur lors de la publication."
    );

  }

}


/* =========================================================
   SELLER PRODUCTS
========================================================= */

async function renderSellerProducts(){

  const container =
    document.getElementById(
      "myProducts"
    ) ||
    document.getElementById(
      "sellerDynamicContent"
    );

  if(!container) return;


  if(!currentUser){
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    container.innerHTML =
      "Impossible de charger les articles.";

    return;
  }


  const products =
    data || [];


  if(!products.length){

    container.innerHTML = `
      <div class="empty">
        Tu n'as encore publié aucun article.
      </div>
    `;

    return;
  }


  container.innerHTML =
    products.map(product => {

      const images =
        Array.isArray(
          product.image_urls
        )
          ? product.image_urls
          : [];

      const image =
        images[0] ||
        "https://via.placeholder.com/200x200?text=Produit";


      return `

        <div class="article-row">

          <img
            src="${escapeHtml(image)}"
            alt="${escapeHtml(product.name)}"
          >

          <div class="article-row-info">

            <strong>
              ${escapeHtml(product.name)}
            </strong>

            <div>
              ${formatPrice(product.price)}
            </div>

            <div style="color:#777;font-size:12px">
              ${escapeHtml(product.category || "")}
            </div>

            <button
              class="danger-btn"
              onclick="deleteProduct('${product.id}')"
            >
              Supprimer
            </button>

          </div>

        </div>

      `;

    }).join("");

}


async function deleteProduct(productId){

  if(
    !confirm(
      "Supprimer définitivement cet article ?"
    )
  ){
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .delete()
      .eq(
        "id",
        productId
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if(error){

    console.error(error);

    alert(
      "Impossible de supprimer l'article."
    );

    return;
  }


  alert(
    "Article supprimé."
  );


  await renderSellerProducts();

  await renderProducts();

}

async function renderSellerSales(){

  const container =
    document.getElementById(
      "mySales"
    );

  if(!container || !currentUser){
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("sales")
      .select("*")
      .eq(
        "seller_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    container.innerHTML =
      "Impossible de charger les ventes.";

    return;
  }


  const sales =
    data || [];


  const total =
    sales.reduce(
      (
        sum,
        sale
      ) =>
        sum +
        Number(
          sale.amount || 0
        ),
      0
    );


  container.innerHTML = `

    <div class="sales-total">

      <div>
        Chiffre d'affaires
      </div>

              Aucune vente enregistrée.
            </div>

}

          sale.product_name ||

        )}

      <div>
        Montant :

          ${formatPrice(sale.amount)}
        </strong>
      </div>

      ${
        sale.buyer_name
          ? `
            <div>
              Client :
              ${escapeHtml(sale.buyer_name)}
            </div>
          `
          : ""
      }

      ${
        sale.buyer_phone
          ? `
            <div>
              Téléphone :
              ${escapeHtml(sale.buyer_phone)}
            </div>
          `
          : ""
      }

      ${
        sale.note
          ? `
            <div>
              Note :
              ${escapeHtml(sale.note)}
            </div>
          `
          : ""
      }

      <div style="font-size:12px;color:#777;margin-top:6px">
        ${
          sale.created_at
            ? new Date(
                sale.created_at
              ).toLocaleString(
                "fr-FR"
              )

      </div>

      <button
        class="danger-btn"
        onclick="deleteSale('${sale.id}')"

}


async function addSale(){

  if(!currentUser){
    return;
  }


  const productName =
    document
      .getElementById(
        "saleProductName"
      )
      ?.value
      .trim();

  const amount =
    Number(
      document
        .getElementById(
          "saleAmount"
        )
        ?.value
    );

  const buyerName =
    document
      .getElementById(
        "saleBuyerName"
      )
      ?.value
      .trim();

  const buyerPhone =
    document
      .getElementById(
        "saleBuyerPhone"
      )
      ?.value
      .trim();

  const note =
    document
      .getElementById(
        "saleNote"
      )
      ?.value
      .trim();


  if(
    !productName ||
    !amount
  ){

    alert(
      "Indique le produit et le montant."
    );

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("sales")
      .insert({

        seller_id:
          currentUser.id,

        product_name:
          productName,

        amount,

        buyer_name:
          buyerName,

        buyer_phone:
          buyerPhone,

        note

      });


  if(error){

    console.error(error);

    alert(
      "Impossible d'enregistrer la vente."
    );

    return;
  }


  alert(
    "✅ Vente enregistrée."
  );


  await renderSellerSales();

}


async function deleteSale(saleId){

  if(
    !confirm(
      "Supprimer cette vente ?"
    )
  ){
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("sales")
      .delete()
      .eq(
        "id",
        saleId
      )
      .eq(
        "seller_id",
        currentUser.id
      );


  if(error){

    console.error(error);

    alert(
      "Impossible de supprimer la vente."
    );

    return;
  }


  await renderSellerSales();

}

function renderAdminSeller(seller){

  const active =
    isSellerActive(
      seller

  const avatar =
    getAvatarUrl(
      seller
    );


  const expiration =
    seller.seller_expires_at
      ? new Date(
          seller.seller_expires_at
        ).toLocaleDateString(
          "fr-FR"
        )
      : "—";


  return `

    <div
      class="admin-card"
      id="adminSeller_${seller.id}"
    >

      <div class="admin-card-header">

        <img
          class="avatar"
          src="${escapeHtml(avatar)}"
          alt="Profil"
        >

        <div>

          <strong>
            ${escapeHtml(
              seller.username ||
              "Vendeur"
            )}
          </strong>

          ${
            seller.verified
              ? `<span class="verified-badge">✓</span>`
              : ""
          }

          <div style="font-size:12px;color:#777">
            ${escapeHtml(
              seller.email ||
              ""
            )}
          </div>

        </div>

      </div>


      <div style="margin-top:10px">

        Statut :
        ${
          active
            ? `<span class="status-active">Actif</span>`
            : `<span class="status-inactive">Inactif</span>`
        }

      </div>


      <div style="margin-top:5px">

        Expiration :
        <strong>
          ${expiration}
        </strong>

      </div>


      <div class="admin-actions">

        ${
          active
            ? `
              <button
                class="danger-btn"
                onclick="adminDisableSeller('${seller.id}')"
              >
                Désactiver
              </button>
            `
            : `
              <button
                class="primary-btn"
                onclick="adminActivateSeller('${seller.id}')"
              >
                +30 jours
              </button>
            `
        }


        <button
          class="secondary-btn"
          onclick="adminViewSellerSales('${seller.id}')"
        >
          📊 Voir ses ventes
        </button>

      </div>

    </div>

  `;

}


async function adminActivateSeller(
  sellerId
){

  if(
    !confirm(
      "Accorder 30 jours à ce vendeur ?"
    )
  ){
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .rpc(
        "creator_activate_seller",
        {
          seller_uuid:
            sellerId
        }
      );


  if(error){

    console.error(error);

    alert(
      error.message ||
      "Impossible d'activer le vendeur."
    );

    return;
  }


  alert(
    "✅ 30 jours accordés."
  );


  await renderAdminPanel();

}


async function adminDisableSeller(
  sellerId
){

  if(

      "Désactiver immédiatement ce vendeur ?"

  ){

  }


  const {
    error
  } =
    await supabaseClient
      .rpc(

  if(error){

      "Impossible de désactiver le vendeur."
    );

  alert(

  );

async function adminViewSellerSales(
  sellerId
){

  const container =
    document.getElementById(
      `adminSeller_${sellerId}`
    );

  if(!container) return;


  const {
    data:sales,
    error
  } =
    await supabaseClient
      .from("sales")
      .select("*")
      .eq(
        "seller_id",
        sellerId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    alert(
      "Impossible de charger les ventes."
    );

    return;
  }


  const list =
    sales || [];


  const total =
    list.reduce(
      (
        sum,
        sale
      ) =>
        sum +
        Number(
          sale.amount || 0
        ),
      0
    );


  let box =
    container.querySelector(
      ".seller-sales-admin"

  if(box){

    box.remove();

    return;

  }


  box =
    document.createElement(
      "div"
    );

  box.className =
    "seller-sales-admin";


  box.style.marginTop =
    "12px";


  box.innerHTML = `

    <div
      style="
        background:#f5f5f5;
        padding:12px;
        border-radius:10px;
      "
    >

      <strong>
        Total :
        ${formatPrice(total)}

        ${

            ? list
                .map(

                )
                .join("")
